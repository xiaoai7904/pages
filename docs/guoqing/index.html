<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#e85a4f" />
  <title>国庆出游计划</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Ma+Shan+Zheng&family=Noto+Sans+SC:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <style>
    :root {
      --red: #ec5b4f;
      --red-tab: #f24d3a;
      --booked-bg: #fcd9d4;
      --booked-text: #e85a4f;
      --blue-line: #c8ddf5;
      --blue-dot: #7bb6f5;
      --text: #1a1a1a;
      --muted: #9a9a9a;
      --sub: #8c8c8c;
      --chip: #e8e9ec;
      --bg: #f2f3f5;
      --phone-w: 390px;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: 100%; }
    body {
      font-family: "Noto Sans SC", -apple-system, BlinkMacSystemFont, "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
      background: var(--bg);
      color: var(--text);
      -webkit-font-smoothing: antialiased;
      display: flex;
      justify-content: center;
    }

    .phone {
      width: min(100%, var(--phone-w));
      min-height: 100dvh;
      background: #fff;
      position: relative;
      overflow-x: hidden;
      box-shadow: 0 0 0 1px rgba(0,0,0,.04);
    }

    .sr-only {
      position: absolute;
      width: 1px; height: 1px;
      padding: 0; margin: -1px;
      overflow: hidden;
      clip: rect(0,0,0,0);
      white-space: nowrap;
      border: 0;
    }

    .nav {
      position: absolute;
      top: 0; left: 0; right: 0;
      z-index: 20;
      padding: 18px 18px 0;
      pointer-events: none;
    }
    .nav-title { text-align: center; line-height: 1.25; }
    .nav-title strong {
      display: block;
      font-size: 17px;
      font-weight: 700;
      color: #fff;
      text-shadow: 0 1px 8px rgba(0,0,0,.45), 0 1px 2px rgba(0,0,0,.35);
    }
    .nav-title span {
      display: block;
      margin-top: 4px;
      font-size: 12px;
      color: rgba(255,255,255,.88);
      text-shadow: 0 1px 6px rgba(0,0,0,.4);
    }

    .hero {
      position: relative;
      height: 320px;
      overflow: hidden;
      background: #7a8ea8;
    }
    .hero-bg {
      position: absolute;
      inset: 0;
      display: flex;
    }
    .hero-bg.single {
      background-size: cover;
      background-position: center;
    }
    .hero-bg.split .half {
      flex: 1;
      background-size: cover;
      background-position: center;
    }
    .hero-bg.split .half + .half {
      box-shadow: inset 18px 0 28px rgba(0,0,0,.12);
    }
    .hero::after {
      content: "";
      position: absolute;
      inset: 0;
      background:
        linear-gradient(180deg, rgba(0,0,0,.42) 0%, rgba(0,0,0,.18) 28%, transparent 52%),
        linear-gradient(90deg, rgba(0,0,0,.28) 0%, transparent 48%);
      pointer-events: none;
    }
    .hero-quote {
      position: absolute;
      left: 18px;
      top: 78px;
      z-index: 2;
      max-width: 260px;
    }
    .hero-quote p {
      font-family: "Ma Shan Zheng", "STKaiti", "KaiTi", serif;
      font-size: 26px;
      line-height: 1.35;
      color: #fff;
      text-shadow: 0 2px 10px rgba(0,0,0,.45), 0 1px 2px rgba(0,0,0,.35);
    }
    .hero-quote small {
      display: block;
      margin-top: 10px;
      font-size: 12px;
      color: rgba(255,255,255,.86);
      letter-spacing: .1em;
      text-shadow: 0 1px 6px rgba(0,0,0,.4);
    }
    .loc-pill {
      position: absolute;
      right: 16px;
      bottom: 54px;
      z-index: 2;
      display: inline-flex;
      align-items: center;
      gap: 4px;
      padding: 6px 11px;
      border-radius: 999px;
      background: rgba(20, 24, 30, .55);
      color: #fff;
      font-size: 12px;
      font-weight: 500;
      backdrop-filter: blur(6px);
    }

    .sheet {
      position: relative;
      z-index: 5;
      margin-top: -36px;
      background: #fff;
      border-radius: 28px 28px 0 0;
      padding: 6px 0 40px;
      min-height: 50vh;
    }

    .tabs {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      padding: 10px 8px 0;
      border-bottom: 1px solid #f0f0f0;
    }
    .tab {
      position: relative;
      border: 0;
      background: transparent;
      padding: 10px 0 14px;
      font-size: 14px;
      font-weight: 500;
      color: #333;
      cursor: pointer;
      font-family: inherit;
    }
    .tab.active {
      color: var(--red-tab);
      font-weight: 600;
    }
    .tab.active::after {
      content: "";
      position: absolute;
      left: 50%;
      bottom: 0;
      transform: translateX(-50%);
      width: 28px;
      height: 3px;
      border-radius: 999px;
      background: var(--red-tab);
    }

    .dates {
      display: flex;
      gap: 8px;
      padding: 16px 16px 8px;
      overflow-x: auto;
      scrollbar-width: none;
    }
    .dates::-webkit-scrollbar { display: none; }
    .date-chip {
      flex: 0 0 56px;
      height: 62px;
      border: 0;
      border-radius: 14px;
      background: var(--chip);
      color: #444;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 4px;
      cursor: pointer;
      font-family: inherit;
    }
    .date-chip .d { font-size: 14px; font-weight: 700; line-height: 1; }
    .date-chip .w { font-size: 11px; font-weight: 500; opacity: .85; }
    .date-chip.active {
      background: var(--red);
      color: #fff;
      box-shadow: 0 6px 14px rgba(236, 91, 79, .28);
    }

    .day-head { padding: 14px 18px 8px; }
    .day-head h2 { font-size: 20px; font-weight: 700; }
    .day-head p { margin-top: 6px; font-size: 13px; color: var(--muted); }

    .timeline { padding: 8px 16px 0 12px; list-style: none; }
    .item {
      display: grid;
      grid-template-columns: 46px 18px 1fr;
      column-gap: 6px;
      min-height: 72px;
      padding-bottom: 22px;
    }
    .item:last-child { padding-bottom: 8px; }
    .time {
      padding-top: 2px;
      font-size: 12px;
      font-weight: 600;
      color: #333;
      text-align: right;
      line-height: 1.3;
    }
    .rail { position: relative; display: flex; justify-content: center; }
    .rail::before {
      content: "";
      position: absolute;
      top: 10px;
      bottom: -22px;
      left: 50%;
      width: 2px;
      transform: translateX(-50%);
      background: var(--blue-line);
    }
    .item:last-child .rail::before { display: none; }
    .dot {
      position: relative;
      z-index: 1;
      width: 9px;
      height: 9px;
      margin-top: 6px;
      border-radius: 50%;
      background: var(--blue-dot);
      box-shadow: 0 0 0 3px rgba(123, 182, 245, .22);
    }
    .body {
      display: grid;
      grid-template-columns: 28px 1fr auto;
      column-gap: 8px;
      align-items: start;
      min-width: 0;
    }
    .icon { width: 26px; height: 26px; display: grid; place-items: center; }
    .icon svg { width: 22px; height: 22px; display: block; }
    .copy { min-width: 0; padding-top: 1px; }
    .copy h3 {
      font-size: 14.5px;
      font-weight: 700;
      color: #1c1c1c;
      line-height: 1.35;
    }
    .copy p {
      margin-top: 4px;
      font-size: 12px;
      color: var(--sub);
      line-height: 1.5;
    }
    .badge {
      align-self: start;
      margin-top: 2px;
      padding: 5px 10px;
      border-radius: 999px;
      background: var(--booked-bg);
      color: var(--booked-text);
      font-size: 12px;
      font-weight: 600;
      white-space: nowrap;
    }
    .thumb {
      width: 58px;
      height: 58px;
      border-radius: 10px;
      object-fit: cover;
      display: block;
      background: #eee;
    }

    .panel { display: none; }
    .panel.active { display: block; }
    .placeholder {
      padding: 48px 24px;
      text-align: center;
      color: var(--muted);
      font-size: 14px;
      line-height: 1.8;
      white-space: pre-line;
    }

    /* —— Transport cards —— */
    .transport-list {
      padding: 16px 16px 8px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }
    .ticket {
      background: #f7f8fa;
      border-radius: 16px;
      padding: 14px 14px 13px;
      position: relative;
      overflow: hidden;
    }
    .ticket::before {
      content: "";
      position: absolute;
      left: 0; top: 0; bottom: 0;
      width: 3px;
      background: var(--blue-dot);
      border-radius: 3px 0 0 3px;
    }
    .ticket.is-train::before { background: #5aa6f5; }
    .ticket.is-plane::before { background: #f2a04a; }
    .ticket-top {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      margin-bottom: 14px;
    }
    .ticket-tag {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      font-size: 12px;
      font-weight: 600;
      color: #3a3a3a;
    }
    .ticket-tag .ico {
      width: 22px; height: 22px;
      border-radius: 7px;
      display: grid; place-items: center;
      background: #fff;
    }
    .ticket-tag .ico svg { width: 14px; height: 14px; }
    .ticket-tag .meta {
      color: var(--sub);
      font-weight: 500;
    }
    .ticket-tag .meta::before {
      content: "·";
      margin: 0 5px;
      color: #cfcfcf;
    }
    .ticket-route {
      display: grid;
      grid-template-columns: 1fr auto 1fr;
      align-items: center;
      column-gap: 8px;
      margin-bottom: 12px;
    }
    .ticket-end { min-width: 0; }
    .ticket-end.is-to { text-align: right; }
    .ticket-end .clock {
      font-size: 22px;
      font-weight: 700;
      letter-spacing: -.02em;
      color: #1c1c1c;
      line-height: 1.1;
      font-variant-numeric: tabular-nums;
    }
    .ticket-end .clock.is-empty {
      font-size: 15px;
      font-weight: 600;
      color: var(--muted);
    }
    .ticket-end .city {
      margin-top: 6px;
      font-size: 14px;
      font-weight: 700;
      color: #222;
    }
    .ticket-end .station {
      margin-top: 3px;
      font-size: 11px;
      color: var(--sub);
      line-height: 1.35;
      word-break: break-all;
    }
    .ticket-mid {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 4px;
      padding-top: 2px;
      min-width: 72px;
    }
    .ticket-mid .dur {
      font-size: 11px;
      color: var(--muted);
      white-space: nowrap;
    }
    .ticket-mid .line {
      width: 100%;
      height: 1px;
      background: linear-gradient(90deg, transparent, #c8ddf5 18%, #c8ddf5 82%, transparent);
      position: relative;
    }
    .ticket-mid .line::after {
      content: "";
      position: absolute;
      right: 8px;
      top: 50%;
      width: 6px; height: 6px;
      border-right: 1.5px solid #7bb6f5;
      border-top: 1.5px solid #7bb6f5;
      transform: translateY(-50%) rotate(45deg);
    }
    .ticket-mid .dot-l,
    .ticket-mid .dot-r {
      position: absolute;
      top: 50%;
      width: 5px; height: 5px;
      border-radius: 50%;
      background: var(--blue-dot);
      transform: translateY(-50%);
    }
    .ticket-mid .dot-l { left: 0; }
    .ticket-mid .dot-r { right: 0; }
    .ticket-date {
      font-size: 12px;
      color: var(--sub);
    }
    .ticket-top-right {
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .ticket-foot {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      padding-top: 10px;
      border-top: 1px dashed #e6e8ec;
      font-size: 12px;
      color: var(--sub);
    }
    .ticket-foot .seat { min-width: 0; }
    .ticket-empty {
      padding: 40px 20px;
      text-align: center;
      color: var(--muted);
      font-size: 14px;
    }

    /* —— Hotel cards —— */
    .hotel-list {
      padding: 16px 16px 8px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }
    .hotel-card {
      background: #f7f8fa;
      border-radius: 16px;
      padding: 14px;
      position: relative;
      overflow: hidden;
    }
    .hotel-card::before {
      content: "";
      position: absolute;
      left: 0; top: 0; bottom: 0;
      width: 3px;
      background: #6cbc6a;
      border-radius: 3px 0 0 3px;
    }
    .hotel-top {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 10px;
      margin-bottom: 12px;
    }
    .hotel-title {
      min-width: 0;
      display: flex;
      align-items: flex-start;
      gap: 8px;
    }
    .hotel-title .ico {
      width: 28px; height: 28px;
      border-radius: 8px;
      background: #fff;
      display: grid;
      place-items: center;
      flex-shrink: 0;
    }
    .hotel-title .ico svg { width: 16px; height: 16px; }
    .hotel-title h3 {
      font-size: 15px;
      font-weight: 700;
      line-height: 1.35;
      color: #1c1c1c;
    }
    .hotel-title p {
      margin-top: 3px;
      font-size: 12px;
      color: var(--sub);
    }
    .hotel-dates {
      display: grid;
      grid-template-columns: 1fr auto 1fr;
      align-items: center;
      gap: 8px;
      background: #fff;
      border-radius: 12px;
      padding: 12px 12px;
      margin-bottom: 10px;
    }
    .hotel-date-end .label {
      font-size: 11px;
      color: var(--muted);
    }
    .hotel-date-end .value {
      margin-top: 4px;
      font-size: 16px;
      font-weight: 700;
      color: #1c1c1c;
    }
    .hotel-date-end.is-out { text-align: right; }
    .hotel-nights {
      font-size: 12px;
      font-weight: 600;
      color: #5aa6f5;
      background: #eef5fc;
      border-radius: 999px;
      padding: 5px 10px;
      white-space: nowrap;
    }
    .hotel-meta {
      display: flex;
      flex-direction: column;
      gap: 6px;
      font-size: 12px;
      color: var(--sub);
      line-height: 1.45;
    }
    .hotel-meta strong {
      color: #444;
      font-weight: 600;
    }
    .hotel-foot {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      margin-top: 12px;
      padding-top: 10px;
      border-top: 1px dashed #e6e8ec;
    }
    .hotel-price {
      font-size: 16px;
      font-weight: 700;
      color: var(--red);
    }
    .hotel-price.is-empty {
      font-size: 13px;
      font-weight: 500;
      color: var(--muted);
    }
    .hotel-card.has-thumb {
      display: grid;
      grid-template-columns: 1fr 72px;
      column-gap: 12px;
      align-items: start;
    }
    .hotel-card.has-thumb .hotel-thumb {
      width: 72px;
      height: 72px;
      border-radius: 12px;
      object-fit: cover;
      background: #eee;
    }
    .hotel-city {
      font-size: 12px;
      color: var(--sub);
    }

    /* —— Budget list —— */
    .budget-wrap {
      padding: 16px 16px 8px;
    }
    .budget-note {
      margin: 0 2px 12px;
      font-size: 12px;
      color: var(--muted);
    }
    .budget-list {
      list-style: none;
      background: #f7f8fa;
      border-radius: 16px;
      overflow: hidden;
    }
    .budget-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      padding: 14px 14px;
      border-bottom: 1px solid #eef0f3;
    }
    .budget-item:last-child { border-bottom: 0; }
    .budget-item .left { min-width: 0; }
    .budget-item .label {
      font-size: 14px;
      font-weight: 600;
      color: #222;
      line-height: 1.35;
    }
    .budget-item .hint {
      margin-top: 3px;
      font-size: 11px;
      color: var(--muted);
    }
    .budget-item .amount {
      font-size: 15px;
      font-weight: 700;
      color: #1c1c1c;
      white-space: nowrap;
      font-variant-numeric: tabular-nums;
    }
    .budget-item .amount.is-empty {
      font-size: 13px;
      font-weight: 500;
      color: var(--muted);
    }
    .budget-total {
      margin-top: 12px;
      background: #fff5f4;
      border-radius: 16px;
      padding: 14px 16px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
    }
    .budget-total .label {
      font-size: 14px;
      font-weight: 600;
      color: var(--booked-text);
    }
    .budget-total .amount {
      font-size: 20px;
      font-weight: 700;
      color: var(--red);
      font-variant-numeric: tabular-nums;
    }
    .budget-total .amount.is-empty {
      font-size: 14px;
      font-weight: 500;
      color: var(--muted);
    }

    @media (max-width: 390px) {
      .hero { height: 290px; }
      .hero-quote { top: 72px; }
      .hero-quote p { font-size: 23px; }
      .ticket-end .clock { font-size: 20px; }
    }
  </style>
</head>
<body>
  <div class="phone">
    <h1 class="sr-only" id="page-title">国庆出游计划</h1>

    <header class="nav">
      <div class="nav-title">
        <strong id="nav-title">加载中…</strong>
        <span id="nav-range"></span>
      </div>
    </header>

    <section class="hero" id="hero" aria-label="行程封面">
      <div class="hero-bg" id="hero-bg"></div>
      <div class="hero-quote">
        <p id="hero-quote"></p>
        <small id="hero-quote-sub"></small>
      </div>
      <div class="loc-pill" id="loc-pill">
        <svg width="11" height="14" viewBox="0 0 11 14" fill="none"><path d="M5.5 0C2.46 0 0 2.46 0 5.5c0 3.7 5.5 8.5 5.5 8.5S11 9.2 11 5.5C11 2.46 8.54 0 5.5 0Zm0 7.5A2 2 0 1 1 5.5 3.5a2 2 0 0 1 0 4Z" fill="#fff"/></svg>
        <span id="loc-text"></span>
      </div>
    </section>

    <main class="sheet">
      <nav class="tabs" role="tablist">
        <button class="tab active" type="button" data-tab="itinerary" role="tab" aria-selected="true">行程安排</button>
        <button class="tab" type="button" data-tab="transport" role="tab" aria-selected="false">机票/火车</button>
        <button class="tab" type="button" data-tab="hotel" role="tab" aria-selected="false">酒店住宿</button>
        <button class="tab" type="button" data-tab="budget" role="tab" aria-selected="false">费用预算</button>
      </nav>

      <div class="panel active" id="panel-itinerary" role="tabpanel">
        <div class="dates" id="dates" role="tablist" aria-label="行程日期"></div>
        <div class="day-head" id="day-head">
          <h2></h2>
          <p></p>
        </div>
        <ul class="timeline" id="timeline"></ul>
      </div>

      <div class="panel" id="panel-transport" role="tabpanel">
        <div class="transport-list" id="transport-list"></div>
      </div>
      <div class="panel" id="panel-hotel" role="tabpanel">
        <div class="hotel-list" id="hotel-list"></div>
      </div>
      <div class="panel" id="panel-budget" role="tabpanel">
        <div class="budget-wrap" id="budget-wrap"></div>
      </div>
    </main>
  </div>

  <script src="./trip-config.js"></script>
  <script>
    const ICONS = {
      train: '<svg viewBox="0 0 24 24" fill="none"><path d="M4 15.5V7a4 4 0 0 1 4-4h8a4 4 0 0 1 4 4v8.5M4 15.5h16M4 15.5l-1.5 3h3L7 15.5m10 0 1.5 3h3L20 15.5M8 18.5v1.5m8-1.5v1.5M8 7h8M8 11h8" stroke="#5aa6f5" stroke-width="1.8" stroke-linecap="round"/><circle cx="8.5" cy="15.5" r="1.2" fill="#5aa6f5"/><circle cx="15.5" cy="15.5" r="1.2" fill="#5aa6f5"/></svg>',
      plane: '<svg viewBox="0 0 24 24" fill="none"><path d="M21 16v-2l-8-5V3.5a1.5 1.5 0 0 0-3 0V9l-8 5v2l8-2.5V19l-2 1.5V22l3.5-1 3.5 1v-1.5L13 19v-5.5l8 2.5Z" fill="#5aa6f5"/></svg>',
      car: '<svg viewBox="0 0 24 24" fill="none"><path d="M5 11 3 7h2.5l1.2 2.4h7.1L16 5h2l-1.4 4H19a2 2 0 0 1 2 2v1h-1.1a2.5 2.5 0 0 1-4.8 0H9.9a2.5 2.5 0 0 1-4.8 0H4v-1ZM7.5 15.5a1.5 1.5 0 1 0 0-3 1.5 1.5 0 0 0 0 3Zm9 0a1.5 1.5 0 1 0 0-3 1.5 1.5 0 0 0 0 3Z" fill="#5aa6f5"/></svg>',
      walk: '<svg viewBox="0 0 24 24" fill="none"><circle cx="13.5" cy="4.5" r="2" fill="#5aa6f5"/><path d="M9 21l2.2-5.5L8 13l1.5-4.5 4.8 2.2L17 14l-1 7h-2l.7-4.5-2.2-1.2L10.8 21H9Z" fill="#5aa6f5"/></svg>',
      scenic: '<svg viewBox="0 0 24 24" fill="none"><path d="M4 18.5 9.5 10l3 4.2L16 8.5 22 18.5H4Z" fill="#6cbc6a"/><circle cx="16.5" cy="7" r="1.6" fill="#f2a04a"/></svg>',
      mountain: '<svg viewBox="0 0 24 24" fill="none"><path d="M2 18.5 8.2 9.8l3.1 4.2 3.4-5.4L22 18.5H2Zm13.8-9.2c.9 0 1.6-.7 1.6-1.6S16.7 6.1 15.8 6.1s-1.6.7-1.6 1.6.7 1.6 1.6 1.6Z" fill="#6cbc6a"/></svg>',
      ferry: '<svg viewBox="0 0 24 24" fill="none"><path d="M3 14.5 12 9l9 5.5-1.2 2.2c-2.3-1-4.6-1.5-6.8-1.5s-4.5.5-6.8 1.5L3 14.5Zm1.8 4.2c2-.9 4.1-1.3 6.2-1.3s4.2.4 6.2 1.3l.8-1.4c-2.2-.9-4.5-1.4-7-1.4s-4.8.5-7 1.4l.8 1.4ZM8 8.5V6h8v2.5" stroke="#5aa6f5" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></svg>',
      food: '<svg viewBox="0 0 24 24" fill="none"><path d="M7 3v7a2 2 0 0 1-2 2v9H3.5v-9a2 2 0 0 1-2-2V3H3v7h.75V3h1.5v7H6V3h1Zm10.5 0c2.2 0 3.5 1.5 3.5 3.8V11H19.5v10H18V4.2c0-.7.3-1.2 1-1.2h.2c1.2 0 1.8.8 1.8 2.2V11H21V6.8c0-2.3-1.3-3.8-3.5-3.8H17V21h-1.5V3h2Z" fill="#f2a04a"/></svg>',
      hotel: '<svg viewBox="0 0 24 24" fill="none"><path d="M4 20V9l8-5 8 5v11h-5v-6H9v6H4Zm7 0v-4h2v4h-2Z" fill="#5aa6f5"/></svg>',
    };

    function renderBanner(banner) {
      const el = document.getElementById("hero-bg");
      el.innerHTML = "";
      el.className = "hero-bg " + (banner.mode === "split" ? "split" : "single");
      if (banner.mode === "split") {
        el.innerHTML =
          `<div class="half" style="background-image:url('${banner.left}')"></div>` +
          `<div class="half" style="background-image:url('${banner.right}')"></div>`;
      } else {
        el.style.backgroundImage = `url('${banner.image}')`;
      }
    }

    function renderDay(dayIndex) {
      const cfg = window.TRIP_CONFIG;
      const day = cfg.days[dayIndex];
      if (!day) return;

      document.querySelectorAll(".date-chip").forEach((c, i) => {
        c.classList.toggle("active", i === dayIndex);
      });

      const head = document.getElementById("day-head");
      head.querySelector("h2").textContent = day.title;
      head.querySelector("p").textContent = day.subtitle || "";

      const timeline = document.getElementById("timeline");
      timeline.innerHTML = day.items.map((item) => {
        const icon = ICONS[item.icon] || ICONS.scenic;
        const right = item.thumb
          ? `<img class="thumb" src="${item.thumb}" alt="" />`
          : item.badge
            ? `<span class="badge">${item.badge}</span>`
            : "";
        return `
          <li class="item">
            <div class="time">${item.time || ""}</div>
            <div class="rail"><span class="dot"></span></div>
            <div class="body">
              <div class="icon" aria-hidden="true">${icon}</div>
              <div class="copy">
                <h3>${item.title}</h3>
                ${item.desc ? `<p>${item.desc}</p>` : ""}
              </div>
              ${right}
            </div>
          </li>`;
      }).join("");
    }

    function renderTransport(list) {
      const root = document.getElementById("transport-list");
      if (!list || !list.length) {
        root.innerHTML = `<div class="ticket-empty">暂无机票 / 火车信息</div>`;
        return;
      }

      root.innerHTML = list.map((t) => {
        const kind = t.type === "plane" ? "plane" : "train";
        const kindLabel = kind === "plane" ? "飞机" : "高铁";
        const icon = ICONS[kind];
        const fromTime = t.from?.time || "";
        const toTime = t.to?.time || "";
        const dateLine = [t.date, t.weekday].filter(Boolean).join(" ");
        const footLeft = [t.seat, t.note].filter(Boolean).join(" · ") || (kind === "plane" ? "航空出行" : "铁路出行");
        return `
          <article class="ticket is-${kind}">
            <div class="ticket-top">
              <div class="ticket-tag">
                <span class="ico" aria-hidden="true">${icon}</span>
                <span>${kindLabel}${t.no ? `<span class="meta">${t.no}</span>` : ""}</span>
              </div>
              <div class="ticket-top-right">
                <span class="ticket-date">${dateLine}</span>
                ${t.badge ? `<span class="badge">${t.badge}</span>` : ""}
              </div>
            </div>
            <div class="ticket-route">
              <div class="ticket-end">
                <div class="clock${fromTime ? "" : " is-empty"}">${fromTime || "待定"}</div>
                <div class="city">${t.from?.city || ""}</div>
                <div class="station">${t.from?.station || ""}</div>
              </div>
              <div class="ticket-mid">
                <div class="dur">${t.duration || ""}</div>
                <div class="line"><span class="dot-l"></span><span class="dot-r"></span></div>
              </div>
              <div class="ticket-end is-to">
                <div class="clock${toTime ? "" : " is-empty"}">${toTime || "待定"}</div>
                <div class="city">${t.to?.city || ""}</div>
                <div class="station">${t.to?.station || ""}</div>
              </div>
            </div>
            <div class="ticket-foot">
              <span class="seat">${footLeft}</span>
              <span>${kindLabel}</span>
            </div>
          </article>`;
      }).join("");
    }

    function formatMoney(amount, currency) {
      if (amount === 0) return `${currency || "¥"}0`;
      if (amount === "" || amount == null) return "";
      if (typeof amount === "number") return `${currency || "¥"}${amount.toLocaleString("zh-CN")}`;
      const raw = String(amount).trim();
      if (!raw) return "";
      if (/[¥￥$€]|元/.test(raw)) return raw;
      if (/^\d+(\.\d+)?$/.test(raw)) return `${currency || "¥"}${Number(raw).toLocaleString("zh-CN")}`;
      return raw;
    }

    function sumBudgetAmounts(items) {
      let sum = 0;
      let hasNumber = false;
      for (const item of items || []) {
        const n = typeof item.amount === "number"
          ? item.amount
          : parseFloat(String(item.amount ?? "").replace(/[^\d.-]/g, ""));
        if (!Number.isNaN(n) && String(item.amount ?? "").trim() !== "") {
          sum += n;
          hasNumber = true;
        }
      }
      return hasNumber ? sum : null;
    }

    function renderHotels(list) {
      const root = document.getElementById("hotel-list");
      if (!list || !list.length) {
        root.innerHTML = `<div class="ticket-empty">暂无酒店信息</div>`;
        return;
      }

      root.innerHTML = list.map((h) => {
        const stay = [h.checkIn, h.checkOut].filter(Boolean).join(" - ");
        const priceText = formatMoney(h.price, "¥");
        const thumb = h.thumb
          ? `<img class="hotel-thumb" src="${h.thumb}" alt="" />`
          : "";
        return `
          <article class="hotel-card${h.thumb ? " has-thumb" : ""}">
            <div>
              <div class="hotel-top">
                <div class="hotel-title">
                  <span class="ico" aria-hidden="true">${ICONS.hotel}</span>
                  <div>
                    <h3>${h.name || "酒店"}</h3>
                    <p>${[h.city, stay].filter(Boolean).join(" · ")}</p>
                  </div>
                </div>
                ${h.badge ? `<span class="badge">${h.badge}</span>` : ""}
              </div>
              <div class="hotel-dates">
                <div class="hotel-date-end">
                  <div class="label">入住</div>
                  <div class="value">${h.checkIn || "待定"}</div>
                </div>
                <div class="hotel-nights">${h.nights || "住宿"}</div>
                <div class="hotel-date-end is-out">
                  <div class="label">退房</div>
                  <div class="value">${h.checkOut || "待定"}</div>
                </div>
              </div>
              <div class="hotel-meta">
                ${h.address ? `<div><strong>位置</strong>　${h.address}</div>` : ""}
                ${h.room ? `<div><strong>房型</strong>　${h.room}</div>` : ""}
                ${h.note ? `<div><strong>备注</strong>　${h.note}</div>` : ""}
              </div>
              <div class="hotel-foot">
                <span class="hotel-price${priceText ? "" : " is-empty"}">${priceText || "价格待定"}</span>
                <span class="hotel-city">${h.city || "酒店"}</span>
              </div>
            </div>
            ${thumb}
          </article>`;
      }).join("");
    }

    function renderBudget(budget) {
      const root = document.getElementById("budget-wrap");
      const items = Array.isArray(budget) ? budget : (budget?.items || []);
      const currency = (!Array.isArray(budget) && budget?.currency) || "¥";
      const totalLabel = (!Array.isArray(budget) && budget?.totalLabel) || "预计合计";
      const note = (!Array.isArray(budget) && budget?.note) || "";

      if (!items.length) {
        root.innerHTML = `<div class="ticket-empty">暂无费用预算</div>`;
        return;
      }

      const total = sumBudgetAmounts(items);
      const totalText = total == null ? "" : formatMoney(total, currency);

      root.innerHTML = `
        ${note ? `<p class="budget-note">${note}</p>` : ""}
        <ul class="budget-list">
          ${items.map((item) => {
            const amountText = formatMoney(item.amount, currency);
            return `
              <li class="budget-item">
                <div class="left">
                  <div class="label">${item.label || ""}</div>
                  ${item.note ? `<div class="hint">${item.note}</div>` : ""}
                </div>
                <div class="amount${amountText ? "" : " is-empty"}">${amountText || "待填写"}</div>
              </li>`;
          }).join("")}
        </ul>
        <div class="budget-total">
          <span class="label">${totalLabel}</span>
          <span class="amount${totalText ? "" : " is-empty"}">${totalText || "填写金额后自动合计"}</span>
        </div>`;
    }

    function boot() {
      const cfg = window.TRIP_CONFIG;
      if (!cfg) {
        document.getElementById("nav-title").textContent = "缺少 trip-config.js";
        return;
      }

      const { meta, banner, days } = cfg;
      document.title = meta.title;
      document.getElementById("page-title").textContent = `${meta.title} · ${meta.dateRange}`;
      document.getElementById("nav-title").textContent = meta.title;
      document.getElementById("nav-range").textContent = meta.dateRange;
      document.getElementById("hero-quote").textContent = meta.quote;
      document.getElementById("hero-quote-sub").textContent = meta.quoteSub;
      document.getElementById("loc-text").textContent = meta.location;
      document.getElementById("hero").setAttribute("aria-label", meta.quote);

      if (meta.themeColor) {
        document.querySelector('meta[name="theme-color"]').content = meta.themeColor;
        document.documentElement.style.setProperty("--red", meta.themeColor);
      }

      renderBanner(banner);
      renderTransport(cfg.transport);
      renderHotels(cfg.hotels);
      renderBudget(cfg.budget);

      const dates = document.getElementById("dates");
      dates.innerHTML = days.map((day, i) => `
        <button class="date-chip${i === 0 ? " active" : ""}" type="button" data-day="${i}">
          <span class="d">${day.label}</span>
          <span class="w">${day.weekday}</span>
        </button>
      `).join("");

      dates.querySelectorAll(".date-chip").forEach((chip) => {
        chip.addEventListener("click", () => renderDay(Number(chip.dataset.day)));
      });

      renderDay(0);

      document.querySelectorAll(".tab").forEach((tab) => {
        tab.addEventListener("click", () => {
          document.querySelectorAll(".tab").forEach((t) => {
            t.classList.remove("active");
            t.setAttribute("aria-selected", "false");
          });
          tab.classList.add("active");
          tab.setAttribute("aria-selected", "true");
          document.querySelectorAll(".panel").forEach((p) => p.classList.remove("active"));
          document.getElementById("panel-" + tab.dataset.tab).classList.add("active");
        });
      });
    }

    boot();
  </script>
</body>
</html>
